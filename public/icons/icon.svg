<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0072B2"/>
      <stop offset="100%" style="stop-color:#009E73"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="256" cy="256" r="240" fill="url(#bg-gradient)" filter="url(#shadow)"/>

  <!-- Game controller silhouette -->
  <g fill="#FFFFFF" opacity="0.95">
    <!-- Controller body -->
    <path d="M140 180 L372 180 C394 180 410 196 410 218 L410 294 C410 316 394 332 372 332 L140 332 C118 332 102 316 102 294 L102 218 C102 196 118 180 140 180 Z"/>

    <!-- D-pad -->
    <g transform="translate(150, 240)">
      <rect x="-8" y="-24" width="16" height="48" rx="2"/>
      <rect x="-24" y="-8" width="48" height="16" rx="2"/>
    </g>

    <!-- Action buttons -->
    <circle cx="340" cy="220" r="10"/>
    <circle cx="365" cy="235" r="10"/>
    <circle cx="340" cy="250" r="10"/>
    <circle cx="315" cy="235" r="10"/>

    <!-- Start/Select buttons -->
    <rect x="200" y="260" width="24" height="10" rx="5"/>
    <rect x="240" y="260" width="24" height="10" rx="5"/>
  </g>

  <!-- Play triangle overlay -->
  <path d="M236 206 L236 306 L316 256 Z" fill="#F0E442" opacity="0.9"/>
</svg>
