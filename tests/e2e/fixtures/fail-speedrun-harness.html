<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fail Speedrun Test Harness</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: white;
      min-height: 100vh;
    }
    #test-container {
      width: 100%;
      max-width: 400px;
      height: 400px;
      border: 2px dashed #333;
      border-radius: 12px;
      position: relative;
    }
    .status {
      margin-top: 20px;
      padding: 12px;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>Fail Speedrun Test Harness</h1>
  <div id="test-container"></div>
  <div class="status" id="status">Ready</div>

  <script type="module">
    import * as failSpeedrun from '../../src/shared/fail-speedrun.js';

    // Expose to window for Playwright tests
    window.failSpeedrun = failSpeedrun;

    // Signal that the module is loaded
    document.getElementById('status').textContent = 'Module loaded';
    document.body.dataset.loaded = 'true';
  </script>
</body>
</html>
