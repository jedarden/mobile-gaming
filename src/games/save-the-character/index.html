<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Save the Character - Mobile Gaming</title>

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Save the Character">
  <meta name="description" content="Choose the right action to save the character from danger!">

  <!-- Social / OG Meta Tags -->
  <meta property="og:title" content="Save the Character - Mobile Games">
  <meta property="og:description" content="Choose the right action to save the character from danger!">
  <meta property="og:image" content="https://mobile-gaming.pages.dev/og/save-the-character.png">
  <meta property="og:url" content="https://mobile-gaming.pages.dev/save-the-character/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Styles -->
  <link rel="stylesheet" href="../../styles/reset.css">
  <link rel="stylesheet" href="../../styles/variables.css">
  <link rel="stylesheet" href="../../styles/components.css">
  <link rel="stylesheet" href="../../styles/game-shell.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a href="../../" class="skip-link">Skip to main content</a>

  <div class="game-container">
    <header class="game-header">
      <a href="../../" class="back-link" aria-label="Back to games">
        <span aria-hidden="true">&larr;</span> Back
      </a>
      <h1>Save the Character</h1>
      <div class="game-header-controls">
        <button class="game-btn game-btn-icon game-btn-ghost" id="btn-sound" aria-label="Toggle sound" title="Toggle sound">
          <span aria-hidden="true">🔊</span>
        </button>
        <button class="game-btn game-btn-icon game-btn-ghost" id="btn-restart" aria-label="Restart" title="Restart">
          <span aria-hidden="true">🔄</span>
        </button>
      </div>
    </header>

    <div class="game-stats" role="status" aria-live="polite">
      <div class="game-stat">
        <span class="game-stat-value" id="level-display">1</span>
        <span class="game-stat-label">Scenario</span>
      </div>
      <div class="game-stat">
        <span class="game-stat-value" id="saved-display">0</span>
        <span class="game-stat-label">Saved</span>
      </div>
    </div>

    <main id="main-content" class="game-board" role="main">
      <!-- Loading shell visible before JS loads -->
      <div class="loading-shell" id="loading-shell">
        <div class="loading-spinner"></div>
        <p>Loading game...</p>
      </div>
      <canvas id="game-canvas" aria-label="Save the Character game board"></canvas>
    </main>

    <!-- Level Navigation -->
    <div class="level-nav">
      <button class="game-btn game-btn-ghost" id="btn-prev" aria-label="Previous scenario">
        <span aria-hidden="true">◀</span> Prev
      </button>
      <span id="level-progress" class="level-progress">Scenario 1 / 20</span>
      <button class="game-btn game-btn-ghost" id="btn-next" aria-label="Next scenario">
        Next <span aria-hidden="true">▶</span>
      </button>
    </div>
  </div>

  <!-- Result Overlay -->
  <div class="game-overlay" id="result-overlay" role="dialog" aria-labelledby="result-title" aria-hidden="true">
    <div class="game-overlay-content">
      <h2 class="game-overlay-title" id="result-title">Result</h2>
      <p class="result-message" id="result-message"></p>
      <div class="overlay-buttons">
        <button class="game-btn game-btn-secondary" id="btn-retry">Retry</button>
        <button class="game-btn game-btn-primary" id="btn-continue">Continue</button>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
