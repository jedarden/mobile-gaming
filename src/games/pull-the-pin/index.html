<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pull the Pin</title>
  <meta name="description" content="Guide balls to the goal by pulling pins in the right order">

  <!-- Social / OG Meta Tags -->
  <meta property="og:title" content="Pull the Pin - Mobile Games">
  <meta property="og:description" content="Guide balls to the goal by pulling pins in the right order">
  <meta property="og:image" content="https://mobile-gaming.pages.dev/og/pull-the-pin.png">
  <meta property="og:url" content="https://mobile-gaming.pages.dev/pull-the-pin/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <header id="game-header">
      <a href="../../" class="back-link" aria-label="Back to games"><span aria-hidden="true">&larr;</span> Back</a>
      <h1>Pull the Pin</h1>
      <button id="reset-btn" aria-label="Reset level">↺</button>
    </header>

    <main id="game-main">
      <canvas id="game-canvas" width="320" height="480"></canvas>
    </main>

    <div id="overlay" class="hidden">
      <div id="overlay-content">
        <h2 id="overlay-title"></h2>
        <p id="overlay-message"></p>
        <div id="overlay-buttons">
          <button id="overlay-retry">Retry</button>
          <button id="overlay-next" class="primary">Next Level</button>
        </div>
      </div>
    </div>

    <footer id="game-footer">
      <span id="level-indicator">Level 1</span>
      <button id="btn-hint" aria-label="Get a hint">Hint (5)</button>
      <span id="pin-count">Pins: 3</span>
    </footer>
  </div>

  <script type="module" src="game.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('SW registered:', registration);
          })
          .catch(error => {
            console.log('SW registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
