<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Brain Teaser - Mobile Gaming</title>

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Brain Teaser">
  <meta name="description" content="Lateral-thinking puzzles that test your wit">

  <!-- Social / OG Meta Tags -->
  <meta property="og:title" content="Brain Teaser - Mobile Games">
  <meta property="og:description" content="Lateral-thinking puzzles that test your wit">
  <meta property="og:image" content="https://mobile-gaming.pages.dev/og/brain-teaser.png">
  <meta property="og:url" content="https://mobile-gaming.pages.dev/brain-teaser/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Styles -->
  <link rel="stylesheet" href="../../styles/reset.css">
  <link rel="stylesheet" href="../../styles/variables.css">
  <link rel="stylesheet" href="../../styles/components.css">
  <link rel="stylesheet" href="../../styles/game-shell.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a href="../../" class="skip-link">Skip to main content</a>

  <div class="game-container">
    <header class="game-header">
      <a href="../../" class="back-link" aria-label="Back to games">
        <span aria-hidden="true">&larr;</span> Back
      </a>
      <h1>Brain Teaser</h1>
      <div class="game-header-controls">
        <button class="game-btn game-btn-icon game-btn-ghost" id="btn-sound" aria-label="Toggle sound" title="Toggle sound">
          <span aria-hidden="true">🔊</span>
        </button>
        <button class="game-btn game-btn-icon game-btn-ghost" id="btn-settings" aria-label="Settings" title="Settings">
          <span aria-hidden="true">⚙️</span>
        </button>
      </div>
    </header>

    <div class="game-stats" role="status" aria-live="polite">
      <div class="game-stat">
        <span class="game-stat-value" id="level-display">1</span>
        <span class="game-stat-label">Puzzle</span>
      </div>
      <div class="game-stat">
        <span class="game-stat-value" id="attempts-display">0</span>
        <span class="game-stat-label">Attempts</span>
      </div>
    </div>

    <main id="main-content" class="game-board" role="main">
      <canvas id="game-canvas" aria-label="Brain Teaser puzzle area"></canvas>
    </main>

    <div class="hint-area" id="hint-text" aria-live="polite"></div>

    <div class="game-controls">
      <button class="game-btn game-btn-secondary" id="btn-hint" aria-label="Get hint">
        <span aria-hidden="true">💡</span> Hint
      </button>
      <button class="game-btn game-btn-secondary" id="btn-restart" aria-label="Restart puzzle">
        <span aria-hidden="true">🔄</span> Restart
      </button>
    </div>

    <!-- Level Select -->
    <div class="level-nav">
      <button class="game-btn game-btn-ghost" id="btn-prev" aria-label="Previous puzzle">
        <span aria-hidden="true">◀</span> Prev
      </button>
      <span id="level-progress" class="level-progress">Puzzle 1 / 25</span>
      <button class="game-btn game-btn-ghost" id="btn-next" aria-label="Next puzzle">
        Next <span aria-hidden="true">▶</span>
      </button>
    </div>
  </div>

  <!-- Win Overlay -->
  <div class="game-overlay" id="win-overlay" role="dialog" aria-labelledby="win-title" aria-hidden="true">
    <div class="game-overlay-content">
      <h2 class="game-overlay-title win" id="win-title">Puzzle Solved!</h2>
      <p class="puzzle-title" id="puzzle-title"></p>
      <p class="stats-summary" id="attempts-summary">Solved in 1 try!</p>
      <div class="overlay-buttons">
        <button class="game-btn game-btn-secondary" id="btn-replay">Replay</button>
        <button class="game-btn game-btn-primary" id="btn-next-level">Next Puzzle</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="game-overlay" id="settings-overlay" role="dialog" aria-labelledby="settings-title" aria-hidden="true">
    <div class="game-overlay-content settings-content">
      <h2 id="settings-title">Settings</h2>
      <div class="settings-group">
        <label class="setting-item">
          <span>Sound Effects</span>
          <input type="checkbox" id="setting-sound" checked>
        </label>
        <label class="setting-item">
          <span>Haptic Feedback</span>
          <input type="checkbox" id="setting-haptic" checked>
        </label>
        <label class="setting-item">
          <span>Reduced Motion</span>
          <input type="checkbox" id="setting-motion">
        </label>
      </div>
      <button class="game-btn game-btn-primary" id="btn-close-settings">Close</button>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
